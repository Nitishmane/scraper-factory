name: Claude Builder

on:
  workflow_dispatch:
    inputs:
      title:
        description: Requirement title
        required: true
      details:
        description: What to build
        required: true
      kind:
        description: Requirement kind
        required: false
        default: other
      port_run_id:
        description: Port action run id that triggered this build
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  PORT_BASE_URL: https://api.getport.io
  REQ_ID: req_${{ inputs.port_run_id }}
  BRANCH: req/req_${{ inputs.port_run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register requirement entity in Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: UPSERT
          blueprint: requirement
          identifier: ${{ env.REQ_ID }}
          title: ${{ inputs.title }}
          properties: |
            {
              "description": ${{ toJSON(inputs.details) }},
              "kind": "${{ inputs.kind }}",
              "status": "building"
            }

      - name: Mark Port run started
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: "Claude builder started"

      - name: Build the requirement with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(npm:*),Bash(npx tsc:*)
          prompt: |
            Read CLAUDE.md at the repo root first -- it is the contract for this repo. Follow it.

            Implement this requirement:
            Title: ${{ inputs.title }}
            Details: ${{ inputs.details }}

            HARD RULES (never violate):
            - Never modify any file under fixtures/ (especially fixtures/*.expected.json). They are frozen inputs.
            - Never modify src/factory/agents/verifier.py.
            - Never change the drift thresholds in src/factory/detect.py.
            - Keep the diff as small as possible; touch only what the requirement needs.

            Workflow:
            1. Create and switch to a new branch named exactly: req/${{ env.REQ_ID }}
            2. Make the change.
            3. Commit it, then push the branch to origin.
            4. Open a pull request to main with `gh pr create`.
            5. The PR body MUST START with this exact line, on its own line:
               Requirement: ${{ env.REQ_ID }}
               Follow that line with a short plan and a summary of the diff.

      - name: Locate the opened PR
        if: success()
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Opened PR: $PR_URL"

      - name: Flip requirement to in review
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: UPSERT
          blueprint: requirement
          identifier: ${{ env.REQ_ID }}
          properties: |
            {
              "status": "in_review",
              "pr_url": "${{ steps.pr.outputs.pr_url }}",
              "branch": "${{ env.BRANCH }}"
            }

      - name: Report success to Port run
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: SUCCESS
          link: ${{ steps.pr.outputs.pr_url }}
          logMessage: "Claude builder opened PR ${{ steps.pr.outputs.pr_url }}"

      - name: Report failure to Port
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: UPSERT
          blueprint: requirement
          identifier: ${{ env.REQ_ID }}
          properties: |
            {
              "status": "failed"
            }

      - name: Report failure to Port run
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: FAILURE
          logMessage: "Claude builder failed -- see the workflow run logs"
